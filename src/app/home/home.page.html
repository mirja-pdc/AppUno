<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      {{titulo}}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  // INTERPOLACIÓN
  <ion-card>
    <ion-card-header>
      <ion-card-title>Card Title</ion-card-title>
      <ion-card-subtitle>Card Subtitle</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p>Aquí se muestra el componente.</p>
    </ion-card-content>

    <ion-note>
      <strong>Título: </strong> <em>{{titulo}}</em><br>
      <strong>Descripción: </strong> <em>{{descripcion}}</em><br>
      <strong>Resultado de 3 x 4: </strong> <em>{{3 * 4}}</em>
    </ion-note>
  </ion-card>


  // PROPERTY BINDING


  // EVENT BINDING


  // ION-LIST Y LÓGICA


</ion-content>
